name: Android device check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run native:prepare
      - name: Compile before starting emulator to keep memory available
        working-directory: android
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx1536m
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: |
            adb logcat -c
            adb logcat > android-device-logcat.txt &
            cd android && bash gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx1024m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-test-report
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android-device-logcat.txt
