name: Android device check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run native:prepare
      - name: Regression tests and dependency security audit
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs';import {spawnSync} from 'node:child_process';const files=JSON.parse(readFileSync('package.json')).scripts.test.split(' ').slice(2);const r=spawnSync(process.execPath,['--test','--test-isolation=none',...files],{stdio:'inherit'});process.exit(r.status??1);"
          npm audit --audit-level=moderate
      - name: Compile before starting emulator to keep memory available
        working-directory: android
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx1536m
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record runner resources during device tests
        run: |
          free -h
          df -h /
          nohup vmstat 5 > runner-resources.txt 2>&1 &
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # 37.2.12 crashes its host RenderThread during camera/WebView tests.
          # Google archive: emulator-linux_x64-15261927.zip (36.5.11 stable).
          emulator-build: 15261927
          arch: x86_64
          target: google_apis
          ram-size: 2560M
          cores: 2
          # Reopening the checkerboard camera crashes the host renderer in this runner.
          # Use the virtual-scene camera and ANGLE software backend; retain all assertions.
          emulator-options: -no-window -gpu swangle -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back virtualscene -memory 2560
          disable-animations: true
          script: |
            adb logcat -c
            adb logcat > android-device-logcat.txt &
            cd android && bash gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx1024m
      - name: Record host state after device tests
        if: always()
        run: |
          free -h > runner-final-state.txt
          df -h / >> runner-final-state.txt
          ps -eo pid,comm,rss --sort=-rss | head -20 >> runner-final-state.txt
          sudo dmesg | grep -Ei 'out of memory|oom|killed process|segfault' >> runner-final-state.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-test-report
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android-device-logcat.txt
            runner-resources.txt
            runner-final-state.txt
